<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <title>Page not found | Sabrina Muqadas</title>
  <meta name="description" content="The page you were looking for could not be found.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1220">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; object-src 'none'">

  <base href="/">
  <link rel="icon" type="image/png" href="assets/image/favicon.png">
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <main class="not-found" id="main">
    <div class="hero__bg" aria-hidden="true">
      <span class="hero__glow hero__glow--a"></span>
      <span class="hero__glow hero__glow--b"></span>
      <span class="hero__lines"></span>
    </div>
    <div class="not-found__inner">
      <a class="brand" href="./" aria-label="Sabrina Muqadas, home">
        <img class="brand__logo" src="assets/image/logo.png" width="876" height="141" alt="Sabrina Muqadas">
      </a>
      <p class="not-found__code text-gradient" aria-hidden="true">404</p>
      <h1 class="not-found__title">This page took a different route.</h1>
      <p class="text-muted not-found__text">The page you are looking for does not exist or has moved. Let's get you back to something useful.</p>
      <div class="not-found__actions">
        <a class="btn btn--primary btn--lg" href="./">Back to homepage</a>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>403 Forbidden</title>
  <link rel="icon" href="../assets/image/favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.5rem; background: #0B1220; color: #F8FAFC;
      font: 500 1rem/1.55 system-ui, sans-serif;
    }
    main {
      width: min(100%, 26rem); padding: 2.5rem 1.75rem; text-align: center;
      border: 1px solid rgb(148 163 184 / 0.2); border-radius: 1rem; background: #111C2E;
    }
    .code { margin: 0; font-size: clamp(3.5rem, 12vw, 5rem); line-height: 1; color: #2DD4BF; font-weight: 800; }
    h1 { margin: 0.75rem 0 0.5rem; font-size: 1.35rem; }
    p { margin: 0; color: #94A3B8; }
    a {
      display: inline-block; margin-top: 1.5rem; padding: 0.7rem 1.1rem;
      border-radius: 999px; background: #2DD4BF; color: #0B1220;
      text-decoration: none; font-weight: 700; font-size: 0.9rem;
    }
    a:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">403</p>
    <h1>Access forbidden</h1>
    <p>This directory is not publicly browsable.</p>
    <a href="../">Return home</a>
  </main>
</body>
</html>
